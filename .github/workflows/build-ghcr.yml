name: Build GHCR image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate scripts and manifest
        run: |
          bash -n scripts/start.sh scripts/common.sh scripts/install_custom_nodes.sh scripts/container_smoke.sh
          python3 -m py_compile scripts/download_models.py scripts/check_env.py scripts/check_workflow_nodes.py scripts/long_video.py scripts/prepare_workflows.py scripts/recipe_matrix.py custom_nodepacks/ComfyUI-LTXLoop/__init__.py custom_nodepacks/ComfyUI-LTXLoop/nodes.py custom_nodepacks/ComfyUI-LTXLoop/mosaic_nodes.py
          python3 scripts/prepare_workflows.py --check
          python3 -m pip install --disable-pip-version-check numpy==2.2.6
          python3 -m unittest discover -s tests -v

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: cuda12.8
            cuda_variant: "12.8"
            primary: true
            base_image: runpod/comfyui:1.4.4-cuda12.8@sha256:7078f94dbe28d079c487c245dc3524443e2c6225a6208a1fff8c7a652c1b3a40
          - cuda: cuda13.0
            cuda_variant: "13.0"
            primary: false
            base_image: runpod/comfyui:1.4.4-cuda13.0@sha256:949b0688db0692b97b9aab9efd1c8f5afe94cfaa32c32008f31bcafcff63baf1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/claude-ltx
          CUDA_VARIANT: ${{ matrix.cuda }}
          PRIMARY: ${{ matrix.primary }}
        run: |
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${CUDA_VARIANT}"
            echo "${IMAGE}:${GITHUB_SHA}-${CUDA_VARIANT}"
            if [[ "${PRIMARY}" == "true" ]]; then
              echo "${IMAGE}:latest"
              echo "${IMAGE}:${GITHUB_SHA}"
            fi
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            BUILD_REVISION=${{ github.sha }}
            CUDA_VARIANT=${{ matrix.cuda_variant }}
          cache-from: type=gha,scope=${{ matrix.cuda }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cuda }}
          provenance: false
