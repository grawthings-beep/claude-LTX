name: Build GHCR image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate scripts and manifest
        run: |
          bash -n scripts/start.sh scripts/common.sh scripts/install_custom_nodes.sh scripts/container_smoke.sh
          python3 -m py_compile scripts/download_models.py scripts/check_env.py scripts/check_workflow_nodes.py scripts/long_video.py scripts/prepare_workflows.py scripts/recipe_matrix.py custom_nodepacks/ComfyUI-LTXLoop/__init__.py custom_nodepacks/ComfyUI-LTXLoop/nodes.py custom_nodepacks/ComfyUI-LTXLoop/mosaic_nodes.py
          python3 scripts/prepare_workflows.py --check
          python3 -m unittest discover -s tests -v

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/claude-ltx:latest
            ghcr.io/${{ github.repository_owner }}/claude-ltx:cuda13.0
            ghcr.io/${{ github.repository_owner }}/claude-ltx:cuda12.8
            ghcr.io/${{ github.repository_owner }}/claude-ltx:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
